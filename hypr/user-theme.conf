# ========== Тема Tokyo Night ==========
# Читается последним, перекрывает системные конфиги Ximper

# --- границы и промежутки ---
general {
    gaps_in = 6
    gaps_out = 6
    border_size = 1

    col.active_border = rgba(7aa2f799) rgba(bb9af799) 45deg
    col.inactive_border = rgb(292e42)
}

# --- украшения ---
decoration {
    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 2
        vibrancy = 0.17
        noise = 0.01
        new_optimizations = true
    }

    shadow {
        enabled = true
        color = rgba(000000aa)
        range = 12
        render_power = 3
        ignore_window = true
    }
}

# --- анимации: короткие, плавные под 60 Гц ---
animations {
    enabled = true

    bezier = smoothout, 0.05, 0.9, 0.1, 1
    bezier = smoothin, 0.4, 0, 0.2, 1
    bezier = worksp, 0.25, 0.8, 0.25, 1

    animation = windows, 1, 4, smoothout, popin 85%
    animation = windowsOut, 1, 4, smoothin, popin 85%
    animation = fade, 1, 3, smoothout
    animation = border, 1, 6, default
    animation = workspaces, 1, 5, worksp, slide
    animation = specialWorkspace, 1, 5, worksp, slidefadevert -75%
}

# --- мигрированные правки из /etc (этап 1) ---
env = HYPRLAND_NO_SD_VARS,1

exec-once = nm-applet --indicator
exec-once = ~/.config/waybar/scripts/volume-ui.sh daemon

# --- хоткеи: восстановленные из бэкапа ---
unbind = SUPER, Print
bind = SUPER SHIFT, S, exec, /home/evg/.config/hypr/scripts/screenshot.sh region
bind = $mainMod, N, exec, swaync-client -t -sw



# Blur под панелью waybar
layerrule[waybar-blur] {
    match:namespace = waybar
    blur = true
    ignore_alpha = 0.5
}

layerrule = blur on, match:namespace swaync-notification-window
layerrule = blur on, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-notification-window
